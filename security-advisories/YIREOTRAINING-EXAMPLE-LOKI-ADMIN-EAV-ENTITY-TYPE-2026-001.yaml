summary: Broken access control allows unauthorized admin users to modify EAV entity types
details: >
  The EAV entity type grid did not declare an ACL resource for its Loki AJAX endpoint, so access
  fell back to the generic Loki_Components::index resource, and the menu item referred to an
  undeclared ACL resource. Any admin user with that generic permission could therefore load the
  grid and act on it. In addition, the grid was only made read-only by hiding its action buttons
  (hide_actions), while inline edit updates were still accepted server-side. Admin users without
  the module-specific permissions could thus modify rows of the eav_entity_type table, including
  class names like entity_model and attribute_model, which can break or alter the behaviour of
  the shop. Version 0.0.6 enforces dedicated ACL resources for the grid, saving and deleting
  (nested under Content > Elements) and strips inline edit updates on the server.
